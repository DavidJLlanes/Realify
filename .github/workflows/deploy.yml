name: Deploy a realify.es

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-realify
  cancel-in-progress: false

jobs:
  release_guard:
    name: Verificar versión de publicación
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.guard.outputs.should_deploy }}
      version: ${{ steps.guard.outputs.version }}
    steps:
      - name: Obtener repositorio completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Validar versión, caché y release
        id: guard
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(tr -d '[:space:]' < VERSION)"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          JSON_VERSION="$(python - <<'PY'
import json
print(json.load(open("version.json", encoding="utf-8"))["version"])
PY
          )"

          SW_VERSION="$(python - <<'PY'
import re
s=open("sw.js", encoding="utf-8").read()
m=re.search(r'const VERSION = "realify-v(\d+)', s)
print(m.group(1) if m else "")
PY
          )"

          MAIN_VERSION="$(python - <<'PY'
import re
s=open("index.html", encoding="utf-8").read()
m=re.search(r'js/main\.js\?v=(\d+)', s)
print(m.group(1) if m else "")
PY
          )"

          BOOT_VERSION="$(python - <<'PY'
import re
s=open("index.html", encoding="utf-8").read()
m=re.search(r'js/boot-guard\.js\?v=(\d+)', s)
print(m.group(1) if m else "")
PY
          )"

          if [ "$VERSION" != "$JSON_VERSION" ] || [ "$VERSION" != "$SW_VERSION" ] || [ "$VERSION" != "$MAIN_VERSION" ] || [ "$VERSION" != "$BOOT_VERSION" ]; then
            echo "::error::Versionado desincronizado. VERSION=$VERSION version.json=$JSON_VERSION sw.js=$SW_VERSION main.js=$MAIN_VERSION boot-guard=$BOOT_VERSION"
            exit 1
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PREV_VERSION="$(git show "$BEFORE:VERSION" 2>/dev/null | tr -d '[:space:]' || true)"
          CHANGED="$(git diff --name-only "$BEFORE" "${{ github.sha }}")"

          # Cambios sólo administrativos/documentales no necesitan publicar.
          RUNTIME_CHANGED="$(printf '%s\n' "$CHANGED" | grep -Ev '^(VERSION|version\.json|sw\.js|index\.html|\.github/|.*\.md$|$)' || true)"

          if [ -n "$RUNTIME_CHANGED" ] && [ "$VERSION" = "$PREV_VERSION" ]; then
            echo "::error::Hay cambios de aplicación en main pero VERSION no aumentó. Crea el commit de release y sincroniza VERSION, version.json, sw.js e index.html."
            echo "Archivos pendientes de release:"
            printf '%s\n' "$RUNTIME_CHANGED"
            exit 1
          fi

          if [ "$VERSION" != "$PREV_VERSION" ]; then
            if ! [[ "$VERSION" =~ ^[0-9]+$ && "$PREV_VERSION" =~ ^[0-9]+$ ]]; then
              echo "::error::VERSION debe ser numérica."
              exit 1
            fi
            if [ "$VERSION" -le "$PREV_VERSION" ]; then
              echo "::error::La versión debe aumentar: anterior=$PREV_VERSION nueva=$VERSION"
              exit 1
            fi
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "Release Realify v$VERSION autorizado."
          else
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "Sin incremento de versión: no se despliega."
          fi

  deploy:
    name: Publicar Realify
    needs: release_guard
    if: needs.release_guard.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Preparar clave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          for i in 1 2 3; do
            ssh-keyscan -T 15 -t ed25519 -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null && [ -s ~/.ssh/known_hosts ] && break
            sleep $((i * 10))
          done

      - name: Actualizar la web en el VPS
        run: |
          for i in 1 2 3 4; do
            ssh -i ~/.ssh/deploy_key -o ConnectTimeout=20 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
              "cd ${{ secrets.VPS_PATH }} \
               && git fetch --quiet origin main \
               && git reset --hard origin/main \
               && git log --oneline -1" && exit 0
            echo "Intento $i fallido; reintentando en $((i * 15)) s..."
            sleep $((i * 15))
          done
          exit 1

      - name: Verificar versión publicada
        env:
          EXPECTED_VERSION: ${{ needs.release_guard.outputs.version }}
        run: |
          set -euo pipefail
          URL="https://realify.es/version.json?release=${GITHUB_SHA}"
          for i in 1 2 3 4 5 6; do
            BODY="$(curl -fsS --max-time 15 -H 'Cache-Control: no-cache' "$URL" || true)"
            LIVE_VERSION="$(printf '%s' "$BODY" | python -c 'import json,sys; try: print(json.load(sys.stdin).get("version","")) except Exception: print("")' 2>/dev/null || true)"
            if [ "$LIVE_VERSION" = "$EXPECTED_VERSION" ]; then
              echo "realify.es sirve Realify v$EXPECTED_VERSION"
              exit 0
            fi
            echo "Producción aún devuelve v${LIVE_VERSION:-?}; reintento $i/6..."
            sleep 10
          done
          echo "::error::El VPS se actualizó pero realify.es no sirve la versión v$EXPECTED_VERSION."
          exit 1
